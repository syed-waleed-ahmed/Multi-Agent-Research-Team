# Alembic CLI configuration (for authoring new migrations).
# The app applies migrations automatically at startup; you only need this to run
# e.g. `alembic revision --autogenerate -m "..."` or `alembic upgrade head`.
# The database URL is read from the DATABASE_URL environment variable.
[alembic]
script_location = src/research_team/web/migrations
prepend_sys_path = src
sqlalchemy.url = sqlite:///./data/research.db

[loggers]
keys = root

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[handler_console]
class = StreamHandler
args = (sys.stderr,)
formatter = generic

[formatter_generic]
format = %(levelname)s %(name)s: %(message)s
