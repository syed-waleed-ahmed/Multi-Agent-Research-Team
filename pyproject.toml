[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "multi-agent-research-team"
version = "0.1.0"
description = "A production-oriented multi-agent research CLI built with CrewAI, Groq, and Serper."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "crewai>=0.60.0",
  "crewai-tools>=0.28.0",
  "groq>=0.12.0",
  "litellm>=1.59.0",
  "python-dotenv>=1.0.1",
  "rich>=13.7.0",
  "tabulate>=0.9.0",
]

[project.scripts]
multi-agent-research-team = "src.main:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["src*"]