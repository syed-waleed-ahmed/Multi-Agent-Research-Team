[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "multi-agent-research-team"
# Single source of truth: research_team.__version__ (src/research_team/__init__.py).
dynamic = ["version"]
description = "An open-source multi-agent AI research platform (CLI + web app) built with CrewAI."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Syed Waleed Ahmed", email = "syedwaleedahmed9@gmail.com" }]
keywords = [
  "crewai",
  "multi-agent",
  "ai-agents",
  "llm",
  "litellm",
  "groq",
  "research",
  "web-search",
  "code-generation",
  "cli",
  "fastapi",
]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Environment :: Console",
  "Environment :: Web Environment",
  "Framework :: FastAPI",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
# Core research engine + CLI.
dependencies = [
  "crewai>=1.15,<2.0.0",
  "litellm>=1.59.0",
  "httpx>=0.27",
  "python-dotenv>=1.0.1",
  "rich>=13.7.0",
]

[project.optional-dependencies]
# Web API, job runner and persistence. All permissively licensed (MIT/BSD).
web = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlalchemy>=2.0.30",
  "alembic>=1.13",
  "pg8000>=1.31",
]
dev = [
  "multi-agent-research-team[web]",
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.6",
  "mypy>=1.11",
]

[project.scripts]
multi-agent-research-team = "research_team.cli:main"
research-team-web = "research_team.web.server:main"

[project.urls]
Homepage = "https://github.com/syed-waleed-ahmed/Multi-Agent-Research-Team"
Repository = "https://github.com/syed-waleed-ahmed/Multi-Agent-Research-Team"
Documentation = "https://github.com/syed-waleed-ahmed/Multi-Agent-Research-Team#readme"
Issues = "https://github.com/syed-waleed-ahmed/Multi-Agent-Research-Team/issues"
Changelog = "https://github.com/syed-waleed-ahmed/Multi-Agent-Research-Team/blob/main/CHANGELOG.md"

[tool.setuptools]
include-package-data = true

[tool.setuptools.dynamic]
version = { attr = "research_team.__version__" }

[tool.setuptools.package-data]
research_team = ["py.typed", "web/migrations/*.mako", "web/migrations/*.ini"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["research_team*"]

# --------------------------------------------------------------------------- #
# Tooling
# --------------------------------------------------------------------------- #
[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]
extend-exclude = ["frontend", "graphify-out"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W", "C4"]
ignore = ["E501"]  # line length is enforced by the formatter, not the linter

[tool.ruff.lint.flake8-bugbear]
# FastAPI's dependency-injection idiom uses calls in argument defaults.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Header", "fastapi.Query"]

[tool.mypy]
python_version = "3.10"
files = ["src"]
ignore_missing_imports = true
warn_unused_ignores = false
warn_redundant_casts = true
no_implicit_optional = true
# We type-check our own package only (files = ["src"]). Some heavy third-party
# dependencies (and their transitive deps, e.g. numpy) ship stubs using the
# PEP 695 `type` statement, which mypy only parses under a 3.12+ target and which
# otherwise breaks the 3.10 target in CI. We do not depend on their static types,
# so skip reading their stubs entirely. follow_imports_for_stubs makes the skip
# apply to .pyi files, not just .py sources.
follow_imports_for_stubs = true

[[tool.mypy.overrides]]
module = [
  "numpy",
  "numpy.*",
  "crewai",
  "crewai.*",
  "litellm",
  "litellm.*",
]
follow_imports = "skip"

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra --strict-markers"
pythonpath = ["src"]
filterwarnings = [
  # Third-party deprecation noise (CrewAI/LiteLLM/pydantic) we cannot fix here.
  "ignore::DeprecationWarning",
  "ignore::PendingDeprecationWarning",
]
