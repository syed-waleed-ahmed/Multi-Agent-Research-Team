name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install project (with web + dev extras)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Ruff (lint)
        run: ruff check .

      - name: Ruff (format check)
        run: ruff format --check .

      - name: Mypy (type check)
        run: mypy

      - name: Pytest (no network, no API keys)
        run: pytest -ra --cov=research_team --cov-report=term-missing:skip-covered

  postgres:
    name: Backend on PostgreSQL
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: research_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Migrations, repository and API lifecycle on PostgreSQL (pg8000)
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/research_test
        run: pytest -ra tests/test_postgres.py

  frontend:
    name: Frontend (lint, types, unit tests, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build

  e2e:
    name: End-to-end (Playwright)
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install backend
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[web]"

      - name: Install frontend and browser
        working-directory: frontend
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Run E2E tests (real API + deterministic fake engine)
        working-directory: frontend
        env:
          CI: "true"
          E2E_PYTHON: python
        run: npm run test:e2e

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report
          retention-days: 7

  security:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install the app exactly as the Docker image does
        run: |
          python -m pip install --upgrade pip
          pip install -c constraints/security.txt ".[web]"
          pip freeze --exclude-editable | grep -v "^multi-agent-research-team" > /tmp/requirements.lock

      - name: Audit Python dependencies (pip-audit, isolated environment)
        # chromadb advisories concern the Chroma *server* (auth/RBAC, pre-auth code
        # injection) and have no fixed release yet. This app never runs or exposes
        # a Chroma server (CrewAI memory/knowledge are not used); the exception is
        # documented and reviewed in SECURITY.md. Every other advisory fails CI.
        run: |
          python -m venv /tmp/audit
          /tmp/audit/bin/pip install --quiet pip-audit
          /tmp/audit/bin/pip-audit -r /tmp/requirements.lock --no-deps --disable-pip \
            --progress-spinner off \
            --ignore-vuln PYSEC-2026-311 \
            --ignore-vuln PYSEC-2026-3813 \
            --ignore-vuln PYSEC-2026-3814 \
            --ignore-vuln PYSEC-2026-3815

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Audit production npm dependencies
        working-directory: frontend
        run: npm audit --omit=dev --audit-level=high

  docker:
    name: Docker image builds
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4

      - name: Build image (no push)
        run: docker build --tag multi-agent-research-team:ci .

      - name: Smoke-test the container
        run: |
          docker run -d --name app -p 8000:8000 \
            -e GROQ_API_KEY=ci-not-a-real-key -e SERPER_API_KEY=ci-not-a-real-key \
            multi-agent-research-team:ci
          for i in $(seq 1 60); do
            curl -sf http://127.0.0.1:8000/api/health && break
            sleep 2
          done
          curl -sf http://127.0.0.1:8000/api/health
          curl -sf http://127.0.0.1:8000/api/v1/meta
          curl -sf -o /dev/null http://127.0.0.1:8000/
          docker logs app
